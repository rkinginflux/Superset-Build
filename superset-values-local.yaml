# Local single-node kubeadm values for Apache Superset Helm chart (Postgres metadata DB)
service:
  type: NodePort
  nodePort:
    http: 32088


ingress:
  enabled: false

extraSecretEnv:
  SUPERSET_SECRET_KEY: "replace-me-before-prod-local-only"

bootstrapScript: |
  #!/bin/bash
  set -e
  if [ ! -f ~/bootstrap ]; then
    /app/.venv/bin/python -m ensurepip --upgrade || true
    /app/.venv/bin/python -m pip install --no-cache-dir psycopg2-binary
    echo "bootstrap complete" > ~/bootstrap
  fi

init:
  enabled: true
  loadExamples: false
  createAdmin: true
  adminUser:
    username: admin
    firstname: Superset
    lastname: Admin
    email: admin@superset.local
    password: admin

postgresql:
  enabled: true
  auth:
    username: superset
    password: superset
    database: superset
  primary:
    persistence:
      enabled: true
      storageClass: local-path
      size: 10Gi

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      storageClass: local-path
      size: 5Gi
  replica:
    persistence:
      enabled: false

supersetWorker:
  replicas:
    enabled: true
    replicaCount: 0

configOverrides:
  docs_config: |
    ENABLE_PROXY_FIX = True
    WTF_CSRF_ENABLED = True
    ROW_LIMIT = 5000
