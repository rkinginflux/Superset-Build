apiVersion: batch/v1
kind: Job
metadata:
  name: superset-local-init-db
  namespace: superset
  labels:
    app: superset
    chart: superset-0.15.5
    release: superset-local
    heritage: Helm
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    metadata:
      name: superset-local-init-db
    spec:
      securityContext:
        runAsUser: 0
