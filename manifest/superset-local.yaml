      - command:
        - /bin/sh
        - -c
        - dockerize -wait "tcp://$DB_HOST:$DB_PORT" -timeout 120s
        envFrom:
        - secretRef:
            name: 'superset-local-env'
        image: 'apache/superset:dockerize'
        imagePullPolicy: 'IfNotPresent'
        name: wait-for-postgres
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 250m
            memory: 128Mi
      containers:
      - name: superset-init-db
        image: "apachesuperset.docker.scarf.sh/apache/superset:5.0.0"
        envFrom:
          - secretRef:
              name: superset-local-env
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - name: superset-config
            mountPath: "/app/pythonpath"
            readOnly: true
        command: ["/bin/sh","-c",". /app/pythonpath/superset_bootstrap.sh; . /app/pythonpath/superset_init.sh"]
        resources:
          {}
      volumes:
        - name: superset-config
          secret:
            secretName: superset-local-config
      restartPolicy: Never
